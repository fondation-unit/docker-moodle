server {
    listen 80;
    server_name ${DOMAIN_NAME};

    # The Docker "web" network must be considered as a proxy.
    # Check the IPAM subnet IP of the network: docker network inspect web
    set_real_ip_from 172.18.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root    /var/www/html/public; # For Moodle up to version 5.0
    index   index.php index.html index.htm;

    client_max_body_size 100M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /r.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
    
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTPS on;

        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 60s;

        fastcgi_pass moodle:9000;
    }

    location /dataroot/ {
        internal;
        alias /var/moodledata/; # Ensure the path ends with /
    }

    location = /local/sitemap/sitemap.xml {
        allow all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }
}
