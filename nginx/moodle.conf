server {
    listen 80;
    server_name ${DOMAIN_NAME};

    root    /var/www/html; # For Moodle up to version 5.0
    index   index.php index.html index.htm;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass moodle:9000;

        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    location /dataroot/ {
        internal;
        alias /var/moodledata/; # Ensure the path ends with /
    }

    location = /local/sitemap/sitemap.xml {
        allow all;
        access_log off;
        log_not_found off;
    }

    # Custom rewrites
    location = /prepa-concours-crfcb {
        rewrite ^ /course/index.php?categoryid=2 last;
    }
    location = /spoc-quero {
        rewrite ^ /course/index.php?categoryid=3 last;
    }
    location = /reseau-urfist {
        rewrite ^ /course/index.php?categoryid=4 last;
    }
    location = /formation-crfcb {
        rewrite ^ /course/index.php?categoryid=11 last;
    }
    location = /inist-cnrs {
        rewrite ^ /course/index.php?categoryid=12 last;
    }
    location = /doranum {
        rewrite ^ /course/index.php?categoryid=13 last;
    }
    location = /centre-ressources-urfist {
        rewrite ^ /course/index.php?categoryid=16 last;
    }
    location = /formadoct {
        rewrite ^ /course/index.php?categoryid=106 last;
    }
    location = /abes {
        rewrite ^ /course/index.php?categoryid=186 last;
    }
    location = /oscar-inrae {
        rewrite ^ /course/index.php?categoryid=195 last;
    }

    location ~ /\.(?!well-known).* {
        return 404;
    }
}
